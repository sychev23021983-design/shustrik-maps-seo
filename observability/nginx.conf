# Definition only; enabled solely by the Shustrik server access_log.
map $uri $shustrik_obs_route {
    default other;
    / home;
    ~^/product/ product;
    ~^/product-category/ category;
    ~^/cart(?:/|$) cart;
    ~^/checkout(?:/|$) checkout;
    ~^/my-account(?:/|$) account;
    ~^/wp-admin(?:/|$) admin;
    ~^/wp-json(?:/|$) api;
    /wp-login.php login;
    /wp-cron.php cron;
    /xmlrpc.php xmlrpc;
}
map $args $shustrik_obs_query { default 1; "" 0; }
log_format shustrik_timing escape=json
    '{"utc":"$time_iso8601","method":"$request_method",'
    '"route":"$shustrik_obs_route","query":"$shustrik_obs_query",'
    '"status":"$status","rt":"$request_time",'
    '"uct":"$upstream_connect_time","uht":"$upstream_header_time",'
    '"urt":"$upstream_response_time","cache":"$upstream_cache_status"}';
